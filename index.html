<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yeni Sahibine Hoş Geldin CC!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        h1 {
            color: #ff3333;
            font-size: 34px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        .card {
            background: #151515;
            border: 1px solid #333;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.15);
        }

        .card h2 {
            margin-top: 0;
            color: #ff4444;
        }

        img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 12px;
            display: block;
        }

        .label {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
            text-transform: uppercase;
        }

        .name {
            font-size: 26px;
            font-weight: bold;
            margin-top: 5px;
        }

        .owner {
            color: #4da6ff;
        }

        .thief {
            color: #ff5555;
        }

        .warning {
            margin-top: 30px;
            padding: 15px;
            border: 1px dashed #555;
            border-radius: 10px;
            color: #777;
            font-size: 13px;
        }

        footer {
            margin-top: 25px;
            color: #555;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🪞 Yeni Sahibine Hoş Geldin CC!</h1>

    <div class="subtitle">
        Resmî ayna devir teslim belgesi
    </div>

    <!-- AYNA -->
    <div class="card">
        <h2>🪞 Çalınan Malzeme</h2>

        <img src="ayna.jpg" alt="Ayna">

        <div class="label">Yeni sahibinin aynası</div>
        <div class="name owner">Hiranur</div>
    </div>

    <!-- ÇALAN KİŞİ -->
    <div class="card">
        <h2>🚨 Çalan Kişi</h2>

        <img src="calan.jpg" alt="Çalan kişi">

        <div class="label">Şüpheli şahıs</div>
        <div class="name thief">miraç ayaz akyol</div>
    </div>

    <div class="warning">
        ⚠️ Bu sayfa tamamen arkadaşlar arası dalga geçmek için açılmıştır.
    </div>

    <footer>
        NASTOXREAL © 2026
    </footer>

</div>

</body>
</html>
